# ==============================================================================
# ReconHub — Nginx Reverse Proxy Configuration Mẫu
# Đặt tại: /etc/nginx/sites-available/reconhub
# Kích hoạt: ln -s /etc/nginx/sites-available/reconhub /etc/nginx/sites-enabled/
# ==============================================================================

upstream reconhub_backend {
    server 127.0.0.1:8050 fail_timeout=0;
    keepalive 32;
}

server {
    listen 80;
    server_name reconhub.internal;

    # Kích thước upload file Excel tối đa 100MB
    client_max_body_size 100M;

    # Gzip nén dữ liệu truyền tải
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/woff2 application/x-javascript;

    # Static caching cho assets của Dash Mantine Components và font
    location /_dash-component-suites/ {
        proxy_pass http://reconhub_backend;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location /assets/ {
        alias /opt/reconhub/app/ui/assets/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Proxy toàn bộ request vào ứng dụng Dash (Gunicorn)
    location / {
        proxy_pass http://reconhub_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout 600 giây tương thích với thời gian truy vấn Oracle qua VPN
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Tắt buffer phản hồi để hỗ trợ SSE/tiến trình nếu cần
        proxy_buffering off;
    }
}

